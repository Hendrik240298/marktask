[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marktask"
version = "0.1.0"
description = "Local Markdown project dashboard, read-only by default"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["dash>=3,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
marktask = "marktask.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
